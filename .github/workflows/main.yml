name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # সরাসরি কমান্ড লাইনে রিপোজিটরি ইনজেক্ট করে ফ্রেশ বিল্ড করা
      - name: Build with Maven
        run: |
          mvn clean package -U --file pom.xml -DremoteRepositories=https://repo.papermc.io/repository/maven-snapshots/,https://repo.papermc.io/repository/maven-public/,https://repo.maven.apache.org/maven2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSusu-Plugin
          path: target/MrSusu-1.0.0.jar
