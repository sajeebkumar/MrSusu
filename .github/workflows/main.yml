name: Build MrSusu Plugin
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download Paper 1.21.1
        run: |
          curl -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/132/downloads/paper-1.21.1-132.jar"
      - name: Install Paper JAR to local Maven repo
        run: |
          mvn install:install-file \
            -Dfile=paper.jar \
            -DgroupId=io.papermc.paper \
            -DartifactId=paper \
            -Dversion=1.21.1-R0.1-SNAPSHOT \
            -Dclassifier=mojang-mapped \
            -Dpackaging=jar
      - name: Build with Maven
        run: mvn clean package -B
      - uses: actions/upload-artifact@v4
        with:
          name: MrSusu-1.0.0
          path: target/MrSusu-1.0.0.jar
