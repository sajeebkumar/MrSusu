name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ক্যাশ ছাড়া একদম ফ্রেশ বিল্ড রান করা
      - name: Build with Maven
        run: mvn clean package -U --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSusu-Plugin
          path: target/MrSusu-1.0.0.jar
