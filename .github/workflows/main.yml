name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. আপনার রিপোজিটরির কোডগুলো রানারের মধ্যে নিয়ে আসা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. জাভা ২১ সেটআপ করা (১.২১.১ ভার্সনের জন্য এটি লাগবে)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ৩. কোনো বাড়তি ঝামেলা ছাড়া সরাসরি Maven দিয়ে প্লাগিন বিল্ড করা
      - name: Build with Maven
        run: mvn clean package --file pom.xml

      # ৪. বিল্ড হওয়ার পর জার (.jar) ফাইলটি ডাউনলোড করার অপশন তৈরি করা
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSusu-Plugin
          path: target/MrSusu-1.0.0.jar
