name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. জাভা ২১ সেটআপ করা
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ৩. Maven দিয়ে প্লাগিন বিল্ড করা (পেপারওয়েট সহ)
      - name: Build with Maven
        run: mvn clean package --file pom.xml

      # ৪. তৈরি হওয়া জার ফাইলটি আপলোড করা (যাতে আপনি ডাউনলোড করতে পারেন)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrSusu-Plugin
          path: target/MrSusu-1.0.0.jar
